name: Scheduled MCP scan

on:
  schedule:
    - cron: "17 1 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: scheduled-mcp-scan
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Generate stable scan report
        run: node src/cli.js scan examples/bad-mcp-server/tools.json --stable --output reports/scheduled-scan.json
      - name: Create a report pull request when results change
        uses: peter-evans/create-pull-request@5f6978faf089d4d20b00c7766989d076bb2fc7f1 # v8.1.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: reports/scheduled-scan.json
          base: ${{ github.event.repository.default_branch }}
          branch: automation/scheduled-mcp-scan
          delete-branch: true
          author: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          committer: github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>
          commit-message: "chore: update scheduled MCP scan report"
          title: "chore: update scheduled MCP scan report"
          body: |
            The scheduled MCP schema scan found a report change.

            Review the report diff before merging. This workflow does not apply schema fixes automatically.
